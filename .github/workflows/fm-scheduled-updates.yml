name: FM scheduled candidate updates

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm-scheduled-updates
  cancel-in-progress: false

jobs:
  generate:
    if: vars.FM_UPDATES_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir .fm/pnpm-store
      - run: pnpm build
      - name: Read prior review data from the automation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-updates.mjs previous
      - name: Synchronize and inspect candidates
        env:
          FM_MODEL_API_KEY: ${{ secrets.FM_MODEL_API_KEY }}
        run: >-
          node scripts/scheduled-updates.mjs
          --repository-config config/scripts.example.json
          --updates-config config/scheduled-updates.example.json
          --previous-state .fm/ci-previous
          --transfer-out .fm/ci-transfer
      - name: Validate reviewed transfer
        id: check
        run: node scripts/ci-updates.mjs check-generated
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.check.outputs.changed == 'true'
        with:
          name: fm-review-${{ github.run_id }}
          path: .fm/ci-transfer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  review-pr:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir .fm/pnpm-store
      - run: pnpm build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fm-review-${{ github.run_id }}
          path: .fm/ci-incoming
      - name: Validate candidates and create or update review PR
        env:
          GH_TOKEN: ${{ github.token }}
          FM_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FM_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci-updates.mjs review-pr
