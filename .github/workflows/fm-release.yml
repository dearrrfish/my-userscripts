name: FM release userscripts

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'packages/**'
      - 'source.lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir .fm/pnpm-store
      - run: pnpm build
      - name: Publish managed userscripts
        run: node scripts/publish.mjs
      - name: Commit and push updated release artifacts
        run: |
          if [ -n "$(git status --porcelain releases/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add releases/
            git commit -m "chore: publish released userscripts [skip ci]"
            git push origin master
          else
            echo "No release artifact changes to commit."
          fi
